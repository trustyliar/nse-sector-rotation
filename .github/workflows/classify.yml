name: Build classification
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Time budget in minutes
        default: "40"
concurrency: data-branch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Get data branch
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 --branch data "$URL" data
      - run: python pipeline/classify.py "${{ inputs.minutes }}"
      - name: Save data
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build classification $(date -u +%F)" || exit 0
          git push -q origin data
