name: Daily update
on:
  workflow_dispatch:
    inputs:
      first:
        description: First date to (re)load, YYYY-MM-DD. Blank = continue from last stored day
        default: ""
      reset:
        description: Type "reset" to clear recorded split adjustments first
        default: ""
  schedule:
    # 16:07 IST: provisional refresh from Yahoo soon after the close (16:37 as a backup slot).
    # 19:37, 20:37, 21:37 IST: replace with NSE's official file once published. 08:07 IST next morning: safety net.
    # GitHub can start scheduled jobs late, sometimes by hours.
    - cron: "37 10 * * 1-5"
    - cron: "7 11 * * 1-5"
    - cron: "7 14,15,16 * * 1-5"
    - cron: "37 2 * * 2-6"
concurrency: data-branch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Get data branch
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 --branch data "$URL" data
      - run: python pipeline/daily_update.py "${{ inputs.first }}" "${{ inputs.reset }}"
      - run: python pipeline/fetch_indices.py
      - run: python pipeline/regime.py
      - run: python pipeline/build_page.py
      - run: python pipeline/sectors.py
      - run: python pipeline/reversal.py
      - run: python pipeline/build_site.py
      - name: Save data
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Daily update $(date -u +%F)" || exit 0
          git push -q origin data
      - name: Publish site
        run: |
          cd data/docs
          rm -rf .git && git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Site $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
