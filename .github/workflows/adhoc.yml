name: Adhoc script
on:
  workflow_dispatch:
    inputs:
      script:
        description: Path of the script to run
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: git clone -q --depth 1 --branch data "https://github.com/${{ github.repository }}" data
      - run: python "${{ inputs.script }}"
