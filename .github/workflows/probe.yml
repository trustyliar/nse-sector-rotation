name: Probe
on:
  workflow_dispatch:
  push:
    paths: [pipeline/probe_classification.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests yfinance pandas
      - run: python pipeline/probe_classification.py
