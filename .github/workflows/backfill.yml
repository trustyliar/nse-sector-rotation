name: Backfill history
on:
  workflow_dispatch:
    inputs:
      start:
        description: First date to pull
        default: "2019-01-01"
concurrency: data-branch
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Get data branch
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 --branch data "$URL" data || { mkdir data && cd data && git init -q -b data && git remote add origin "$URL"; }
      - run: python pipeline/backfill.py "${{ inputs.start }}"
      - name: Save data
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Backfill history from ${{ inputs.start }}" || exit 0
          git push -q origin data
